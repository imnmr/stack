<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title>Data Structure</title>

		<style>
* { margin: 0; padding: 0; border: none; box-sizing: border-box; }

body {
	width: 100%;
	height: 100dvh;
	background-color: #131313;
	font-family: sans-serif;
}

.container {
	width: 100%;
	height: 100%;
	display: flex;
	align-items: center;
	justify-content: center;
}

button {
	width: 5em;
	height: 5em;
	background-color: #bababa;
	border-radius: 45%;
	box-shadow: 0 0 0 rgba(1, 1, 1, 0);
	transition: all 1s ease;
}

button:disabled {
	width: 0;
	height: 0;
}

button:hover:not(:disabled) {
	background-color: #ffe0d0;
	border-radius: 50%;
	box-shadow: 0 0 25px rgba(255, 200, 200, 0.8);
	transform: scale(2);
}
		</style>
	</head>
	<body>
		<audio src="assets/audio/music.mp3" muted></audio>

		<div class="container">
			<button onclick="play()">
			</button>
		</div>

		<script>
			function play() {
				const audio = document.querySelector("audio");
				if (audio.muted) {
					audio.muted = false;
					audio.play();
				}

				const button = document.querySelector("button");
				button.disabled = true;
			}
		</script>
	</body>
</html>
